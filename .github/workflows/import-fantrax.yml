name: Import Fantrax Weekly Stats

on:
  schedule:
    # Mondays and Tuesdays at 8:30 AM Central, after each Sunday finish.
    # Tuesday picks up any stat corrections Fantrax applies after the weekend.
    # Rosters and The Show ratings update every morning in update-team-pages.yml.
    # GitHub cron uses UTC.
    - cron: "30 13 * * 1,2"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-fantrax:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Check Fantrax API conversion
        run: node --test scripts/fantrax-weekly.test.js

      # Documented read-only API; account Secret ID replaces the expiring browser cookie.
      - name: Import weekly stats from Fantrax
        run: node scripts/import-fantrax.js
        env:
          FANTRAX_SECRET_ID: ${{ secrets.FANTRAX_SECRET_ID }}

      - name: Commit updated stats
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Import weekly stats from Fantrax"
          file_pattern: data/weekly-team-stats.js data/weekly-team-stats.csv *.html
