<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Team | Union of Ten Idiots</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="styles/styles.css?v=theme-1" rel="stylesheet" />
  <link href="styles/intelligence.css?v=team-1" rel="stylesheet" />
  <link href="styles/team.css?v=restored-banners-64" rel="stylesheet" />
  <link href="styles/theme.css?v=wordmark-1" rel="stylesheet" />
</head>

<body>
  <script src="scripts/site-header.js?v=standings-1"></script>
  <!-- Filled by scripts/team-page.js. Pick a team with team.html?team=Team%20Name. -->
  <main class="page team-page" data-uti-team-page data-uti-profiles>
    <header class="team-head" id="teamHead">
      <p class="team-loading">Loading team…</p>
    </header>
    <section class="team-hero" aria-label="Team overview">
    <section class="cornerstones" id="teamCornerstones" aria-label="Team cornerstones"><p class="team-loading">Loading team cornerstones…</p></section>
    </section>
    <!-- Extra team history, accolades, odds, and team picker are hidden for now. -->
    <section class="team-accolades" id="teamAccolades" aria-label="Team history and outlook" hidden></section>
    <section class="ui-panel" aria-labelledby="lineupTitle">
      <div class="team-panel-head">
        <h2 id="lineupTitle">Starting lineup</h2>
        <div class="team-rating" id="teamRating"></div>
      </div>
      <div class="lineup">
        <div>
          <div class="field-wrap">
            <div class="field" id="field">
              <svg viewBox="0 0 100 106" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
                <defs>
                  <linearGradient id="park-turf" x2="0" y2="1">
                    <stop stop-color="#28624f"/><stop offset="1" stop-color="#163e34"/>
                  </linearGradient>
                  <pattern id="park-stripes" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
                    <rect width="6" height="12" fill="#b2d4ad" opacity=".07"/>
                  </pattern>
                  <clipPath id="park-playable"><path d="M50 99 L5 51 Q8 29 29 24 Q50 19 71 24 Q92 29 95 51 Z"/></clipPath>
                </defs>
                <!-- Dedicated bullpen decks leave the playing surface uncluttered. -->
                <rect x="1" y="1" width="44" height="14.5" rx="3" class="pen"/>
                <rect x="55" y="1" width="44" height="14.5" rx="3" class="pen"/>
                <text x="23" y="3.8" text-anchor="middle" class="pen-label">RELIEF PITCHING</text>
                <text x="77" y="3.8" text-anchor="middle" class="pen-label">RELIEF PITCHING</text>
                <!-- Symmetric stadium bowl, warning track, and outfield wall. -->
                <path d="M50 104 L1 52 Q3 26 27 20 Q50 14 73 20 Q97 26 99 52 Z" class="park-bowl"/>
                <path d="M50 101 L3 52 Q5 28 28 22 Q50 17 72 22 Q95 28 97 52 Z" class="park-warning"/>
                <path d="M50 99 L5 51 Q8 29 29 24 Q50 19 71 24 Q92 29 95 51 Z" fill="url(#park-turf)"/>
                <rect x="0" y="20" width="100" height="82" fill="url(#park-stripes)" clip-path="url(#park-playable)"/>
                <path d="M5 51 Q8 29 29 24 Q50 19 71 24 Q92 29 95 51" class="park-wall"/>
                <!-- Dirt follows the base diamond; all chalk shares one home point. -->
                <path d="M50 99 L25 74 Q24 61 50 57 Q76 61 75 74 Z" class="park-infield"/>
                <path d="M50 94 L33 77 L50 60 L67 77 Z" fill="url(#park-turf)"/>
                <path d="M50 99 L5 51 M50 99 L95 51" class="chalk"/>
                <path d="M50 96 L31 77 L50 58 L69 77 Z" class="park-basepath"/>
                <circle cx="50" cy="78" r="3.2" class="park-infield"/>
                <rect x="48.9" y="77.5" width="2.2" height=".6" class="base"/>
                <circle cx="50" cy="97" r="4" class="park-infield"/>
                <path d="M48.7 96 L51.3 96 L51.3 97.2 L50 98.3 L48.7 97.2 Z" class="base"/>
                <g class="base">
                  <rect x="67.8" y="75.8" width="2.4" height="2.4" transform="rotate(45 69 77)"/>
                  <rect x="48.8" y="56.8" width="2.4" height="2.4" transform="rotate(45 50 58)"/>
                  <rect x="29.8" y="75.8" width="2.4" height="2.4" transform="rotate(45 31 77)"/>
                </g>
                <path d="M44 98 Q44 90 50 90 Q56 90 56 98" class="park-basepath"/>
              </svg>
            </div>
            <!-- Flex spots and rotation: in the foul-territory corners on wide screens, under the field on phones. -->
            <div class="field-sides" id="fieldSides"></div>
          </div>
          <div class="ovr-legend" id="ovrLegend"></div>
          <div class="player-card" id="playerCard">Tap a player to see their details.</div>
        </div>

        <details class="bench" id="benchDetails" open>
          <summary><h3>Bench, IL and minors <span id="benchCount"></span></h3></summary>
          <div class="bench-groups" id="bench"></div>
        </details>
      </div>
    </section>

    <!-- Same season profile as the old pop-up: season tabs, key numbers, weekly finish, more stats. -->
    <section class="ui-panel" aria-labelledby="profileTitle">
      <div class="team-panel-head">
        <h2 id="profileTitle">Season stats</h2>
        <span class="team-verdict" id="teamVerdict"></span>
      </div>
      <div class="team-profile" id="teamProfile"></div>
    </section>

    <div class="team-two">
      <section class="ui-panel" aria-labelledby="catsTitle">
        <div class="team-panel-head"><h2 id="catsTitle">Category fingerprint</h2></div>
        <p class="ui-panel-note" id="catsNote">Share of each category won. The line is 50%; teal is a strength, coral a weakness.</p>
        <div class="cats" id="teamCats"></div>
      </section>

      <section class="ui-panel" aria-labelledby="rivalsTitle">
        <div class="team-panel-head"><h2 id="rivalsTitle">Rivalries</h2></div>
        <p class="ui-panel-note">All-time head-to-head.</p>
        <div class="rivals" id="teamRivals"></div>
      </section>
    </div>
  </main>

  <dialog class="team-honors-dialog" id="teamHonorsDialog" aria-labelledby="teamHonorsTitle">
    <div class="team-honors-heading"><h2 id="teamHonorsTitle">Accolades &amp; history</h2><form method="dialog"><button type="submit" aria-label="Close accolades">✕</button></form></div>
    <div class="team-honors-body" id="teamHonorsBody"></div>
  </dialog>
  <script src="data/team-logos.js"></script>
  <script src="data/fantasy-owners.js?v=owners-updated-shohei-latz"></script>
  <script src="data/player-values.js"></script>
  <script src="data/draft-order.js?v=draft-1"></script>
  <script src="data/weekly-team-stats.js?v=2026-10-24"></script>
  <script src="data/history/season-results.js?v=2022-results-2"></script>
  <script src="data/rosters.js?v=2027-league"></script>
  <script src="data/show-ratings.js?v=team-1"></script>
  <script src="scripts/league-analytics.js?v=2026-week22-r1-fix2"></script>
  <script src="scripts/title-odds.js?v=team-1"></script>
  <script src="scripts/uti-intelligence.js?v=2022-results"></script>
  <script src="scripts/team-page.js?v=centered-trophy-26"></script>
  <script src="data/cornerstone-scores.js?v=1"></script>
<script src="scripts/team-cornerstones.js?v=mcgonigle-size-46"></script>
</body>

</html>
